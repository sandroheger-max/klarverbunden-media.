name: Buffer einplanen
on:
  push:
    branches: [main]
    paths: ["tiktok/gedankentanken/plan_tiktok.json", "plan.json"]
  workflow_dispatch:
    inputs:
      modus:
        description: "check = Verbindung testen, queue = einplanen"
        default: queue
        type: choice
        options: [queue, check]
      tage:
        description: "wie viele Tage im Voraus einplanen"
        default: "5"
      nur_id:
        description: "nur diesen Eintrag (Test)"
        default: ""

  schedule:
    - cron: "23 6 * * *"   # täglich als Sicherheitsnetz
permissions:
  contents: write
concurrency: buffer
jobs:
  buffer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          WINDOW_DAYS: ${{ inputs.tage || '5' }}
          NUR_ID: ${{ inputs.nur_id || '' }}
        run: python .github/scripts/buffer_queue.py ${{ inputs.modus || 'queue' }}
      - name: Status speichern
        if: always()
        run: |
          git config user.name "buffer-bot"
          git config user.email "buffer-bot@users.noreply.github.com"
          git add -A tiktok plan.json
          git diff --cached --quiet || (git commit -m "Buffer: Status aktualisiert" && (git push || (git pull --rebase && git push)))
